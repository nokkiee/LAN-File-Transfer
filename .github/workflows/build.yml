name: Build apps

# Builds the Windows and Linux apps and checks that each one starts.
# These are unsigned test builds: the key that signs over-Wi-Fi updates never
# leaves the maintainer's computer, so official releases are still made there
# with ./build_all.sh.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            file: LAN-File-Transfer-Windows.exe
          - name: Linux
            # Built on an older Ubuntu so the app also runs on older distributions.
            os: ubuntu-22.04
            file: LAN-File-Transfer-Linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Qt's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Mark as a test build
        # BUILD = 0 means "not a release build" (see lanxfer/_build.py).
        run: python -c "open('lanxfer/_build.py', 'w').write('# CI test build\nBUILD = 0\n')"

      - name: Build
        run: |
          python tools/make_icon.py
          python -m PyInstaller --noconfirm --log-level WARN lan-file-transfer.spec

      - name: Check the app starts (Linux)
        if: runner.os == 'Linux'
        run: |
          ./dist/${{ matrix.file }} --self-test "$RUNNER_TEMP/selftest.json"
          cat "$RUNNER_TEMP/selftest.json"

      - name: Check the app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'selftest.json'
          $p = Start-Process -FilePath 'dist\${{ matrix.file }}' -ArgumentList '--self-test', $report -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
          Get-Content $report

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 30
