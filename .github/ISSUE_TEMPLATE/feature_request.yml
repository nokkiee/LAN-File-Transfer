name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The app aims to stay simple: two computers, same Wi‑Fi, no accounts, no internet.
        Ideas that keep it that way are the easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: When I send lots of photos, I can't tell which ones…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you've considered?
